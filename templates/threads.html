<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='bars.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='threads.css') }}">
</head>
<body class="h-100">

  <!-- === NAVBAR === -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="/">
        <img src="{{ url_for('static', filename='images/New_Logo_JNE.png') }}"
             alt="JNE Logo" width="50" height="50" class="me-2 d-inline-block align-middle">
        CCC DS Data Hub
      </a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item me-2">
        <a class="btn btn-sm btn-active" href="/hub"><i class="bi bi-chat-square-text-fill me-1"></i>Hub</a>
        </li>
        
        <!-- Performance Mode -->
        <li class="nav-item me-2">
        <a class="btn btn-sm btn-outline-light" href="/">
            <i class="bi bi-bar-chart-fill me-1"></i> Performance
        </a>
        </li>

        <!-- Full Mode -->
        <li class="nav-item me-2">
        <a class="btn btn-sm btn-outline-light" href="/full">
            <i class="bi bi-stack me-1"></i> Full Data
        </a>
        </li>

        <!-- Report Mode -->
        <li class="nav-item">
        <a class="btn btn-sm btn-outline-light" href="/report">
            <i class="bi bi-file-earmark-text me-1"></i> Report
        </a>
        </li>

        <!-- Report Explorer -->
        <li class="nav-item">
        <a class="btn btn-sm btn-outline-light" href="/report_explorer">
            <i class="bi bi-folder2-open me-1"></i> Report Explorer
        </a>
        </li>

        <!-- APEX Uploader -->
        <li class="nav-item">
        <a class="btn btn-sm btn-outline-light" href="/apex_uploader">
            <i class="bi bi-arrow-down-up me-1"></i> Apex Uploader
        </a>
        </li>

        <!-- APEX Requester -->
        <li class="nav-item me-2">
        <a class="btn btn-sm btn-outline-light" href="/apex_requester">
            <i class="bi bi-arrow-down me-1"></i> Apex Requester
        </a>
        </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="pt-4">
    <div class="container">

      <!-- Page header -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="mb-0"><i class="bi bi-chat-square-text-fill me-2"></i>Hub</h1>
        <button class="btn btn-outline-secondary btn-sm" id="btnOpenProfile">
          <i class="bi bi-person-circle me-1"></i> <span id="navProfileLabel">Profile</span>
        </button>
      </div>

      <!-- Composer strip -->
      <div class="thread-card mb-3" id="composerStrip" role="button" style="cursor:pointer;">
        <div class="d-flex align-items-center gap-3">
          <div class="flex-shrink-0" id="composerAvatar"></div>
          <div class="flex-grow-1">
            <div class="fw-semibold text-dark mb-1" id="composerName" style="font-size:.9rem;"></div>
            <div class="text-muted" style="font-size:.9rem;">What's new?</div>
          </div>
          <i class="bi bi-pencil-square text-muted"></i>
        </div>
      </div>

      <!-- Topic filter -->
      <div class="mb-3 d-flex gap-2 align-items-center flex-wrap">
        <input type="text" id="topicFilter" class="form-control form-control-sm w-auto"
               placeholder="Filter by topic…" style="min-width:160px;">
        <button class="btn btn-outline-secondary btn-sm" id="btnFilterTopic">
          <i class="bi bi-funnel"></i> Filter
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="btnClearFilter">
          <i class="bi bi-x-circle"></i> Clear
        </button>
      </div>

      <!-- Thread list -->
      <div id="threadList"></div>
      <div id="loadMoreContainer" class="text-center my-3 d-none">
        <button class="btn btn-outline-primary btn-sm" id="btnLoadMore">Load more…</button>
      </div>
      <div id="threadListEmpty" class="text-center text-muted py-5 d-none">
        <i class="bi bi-chat-square-dots display-4"></i>
        <p class="mt-2">Belum ada post. Jadilah yang pertama!</p>
      </div>

    </div>
  </main>

  <!-- ═══════════════════════════════════════════════
       MODAL: First-time / Profile Setup
  ════════════════════════════════════════════════ -->
  <div class="modal fade" id="profileModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person-circle me-2"></i>Set Up Your Profile</h5>
        </div>
        <div class="modal-body">
          <p class="text-muted small">Sebelum berinteraksi, lengkapi profil kamu terlebih dahulu.</p>
          <form id="profileForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="profileUsername" name="username"
                     maxlength="50" placeholder="Masukkan username…" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Profile Picture <span class="text-muted small">(opsional)</span></label>
              <div class="d-flex align-items-center gap-3">
                <img id="profilePicPreview" src="" class="thread-avatar border d-none" alt="preview">
                <input type="file" class="form-control" id="profilePicInput" name="profile_pic"
                       accept=".jpg,.jpeg,.png,.webp">
              </div>
            </div>
            <div id="profileFormError" class="text-danger small d-none"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="btnProfileCancel">Nanti saja</button>
          <button class="btn btn-primary" id="btnProfileSave">
            <span id="profileSaveSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Simpan
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       MODAL: New / Edit Thread
  ════════════════════════════════════════════════ -->
  <div class="modal fade" id="threadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="threadModalTitle"><i class="bi bi-plus-circle me-2"></i>New Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="threadForm" enctype="multipart/form-data">
            <input type="hidden" id="threadModalId">
            <div class="mb-3">
              <label class="form-label fw-semibold">Text <span class="text-danger">*</span></label>
              <textarea class="form-control" id="threadText" name="text" rows="4"
                        placeholder="Apa yang ingin kamu bagikan?" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Topic <span class="text-muted small">(opsional)</span></label>
              <input type="text" class="form-control" id="threadTopic" name="topic"
                     placeholder="Performance">
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Image <span class="text-muted small">(opsional)</span></label>
              <input type="file" class="form-control" id="threadImage" name="image"
                     accept=".jpg,.jpeg,.png,.webp">
              <div id="threadImagePreviewWrap" class="mt-2 d-none">
                <img id="threadImagePreview" src="" class="img-fluid rounded" style="max-height:200px;" alt="preview">
              </div>
            </div>
            <div id="threadFormError" class="text-danger small d-none"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-primary" id="btnThreadSave">
            <span id="threadSaveSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Post
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999">
    <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="appToastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.THREADS_CONFIG = {
      apiBase:    "/api",
      currentIp:  "{{ current_ip }}",
      user:       {{ (user | tojson) if user else 'null' }},
    };
  </script>
  <script src="{{ url_for('static', filename='threads.js') }}"></script>
</body>
</html>
