<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>APEX Request Dashboard</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='bars.ico') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- === NAVBAR === -->
  {% include "_navbar.html" %}
  <main>
    <div class="container mt-3" style="max-width: min(90%, 720px);">
    <h1 class="mb-3">APEX Requester</h1>
    <p class="text-muted mb-4">
        Aplikasi untuk mengotomatisasi proses request AWB ke sistem APEX berdasarkan ID account dan tanggal entry.
    </p>

    <div class="card p-4 shadow-sm">
        <form id="apexForm">
        <div class="mb-3">
            <label>Pilih Server APEX</label>
            <select name="host" id="host" class="form-select" required>
                <option value="">-- Pilih Host --</option>
                <option value="ccc01" selected>ccc01</option>
                <option value="ccc02">ccc02</option>
                <option value="ccc03">ccc03</option>
                <option value="ccc04">ccc04</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" class="form-control" id="username" placeholder="username@example.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Customer IDs (pisahkan spasi)</label>
            <input type="text" class="form-control" id="customer_ids" placeholder="81635700 81635701">
        </div>
        <div class="mb-3">
            <label class="form-label">Periode Tanggal</label>
            <input type="text" class="form-control" id="dateRange" placeholder="Pilih rentang tanggal" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" id="startBtn" class="btn btn-primary w-100">Mulai Proses</button>
            <button type="button" id="resetBtn" class="btn btn-secondary w-50 d-none">Reset</button>
        </div>
        </form>
    </div>

    <div id="progressSection" class="mt-4 d-none">
        <h5>Progress:</h5>
        <div class="progress mb-3">
        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%">0%</div>
        </div>
        <table class="table table-sm table-bordered" id="trackerTable">
        <thead class="table-light">
            <tr>
            <th>Task</th>
            <th>Request</th>
            <th>Download</th>
            </tr>
        </thead>
        <tbody></tbody>
        </table>
    </div>
    </div>
    </main>
    <!-- === FOOTER === -->
  <footer>
    <small>&copy; <span id="year"></span> CCC Data Support. All rights reserved.</small>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="/static/apex_requester.js"></script>
</body>
</html>
